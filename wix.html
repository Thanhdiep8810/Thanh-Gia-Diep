<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlyHyer Inspired Homepage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .scroll-container {
      display: flex;
      flex-direction: row;
      width: 300vw;
      height: 100vh;
      scroll-snap-type: x mandatory;
      overflow-x: scroll;
      scroll-behavior: smooth;
    }

    .panel {
      flex: 0 0 100vw;
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      padding: 3rem;
    }

    .hero {
      background: #0c0c18;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .hero button {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 25px;
    }

    .on-demand {
      position: relative;
      overflow: hidden;
      color: white;
    }

    .on-demand .bg-image {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .info {
      position: absolute;
      bottom: 3rem;
      left: 3rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 1.5rem;
      border-radius: 10px;
      transition: background 0.3s ease;
      cursor: pointer;
    }

    .hover-title {
      font-size: 1.8rem;
      display: flex;
      align-items: center;
    }

    .arrow {
      opacity: 0;
      margin-left: 0.5rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateX(-10px);
    }

    .hover-description {
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.4s ease, max-height 0.4s ease;
      font-size: 1rem;
      margin-top: 0.8rem;
    }

    .info:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .info:hover .hover-description {
      opacity: 1;
      max-height: 100px;
    }

    .shared {
      background: #b4684a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .shared h2 {
      position: absolute;
      bottom: 3rem;
      left: 3rem;
      font-size: 2rem;
    }

    .flight-path {
      position: absolute;
      top: 20%;
      right: 10%;
      width: 200px;
      height: 300px;
    }

    .plane {
      font-size: 2rem;
      position: absolute;
      animation: fly 4s infinite ease-in-out;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: black;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    @keyframes fly {
      0% { transform: translate(0, 250px) rotate(0deg); }
      50% { transform: translate(100px, 150px) rotate(45deg); }
      100% { transform: translate(200px, 0) rotate(90deg); }
    }
  </style>
</head>
<body>
  <main class="scroll-container">
    <!-- Section 1: Hero -->
    <section class="panel hero">
      <div class="hero-content">
        <h1>Flexible Services</h1>
        <p>Smart solutions for all your charter requirements</p>
        <button>All Solutions</button>
      </div>
    </section>

    <!-- Section 2: On-Demand -->
    <section class="panel on-demand">
      <img src="https://i.imgur.com/ENjyzdJ.jpg" alt="Jet" class="bg-image">
      <div class="info">
        <h2 class="hover-title">On-Demand <span class="arrow">&rarr;</span></h2>
        <p class="hover-description">Book your aircraft. Customize all aspects of your journey.</p>
      </div>
    </section>

    <!-- Section 3: Shared Flights -->
    <section class="panel shared">
      <div class="flight-path">
        <div class="plane">&#9992;</div>
        <div class="dot"></div>
      </div>
      <h2>Shared Flights</h2>
    </section>
  </main>

  <script>
    // Optional smooth scroll on vertical wheel input
    const scrollContainer = document.querySelector('.scroll-container');
    scrollContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      scrollContainer.scrollLeft += e.deltaY;
    }, { passive: false });
  </script>
</body>
</html>
